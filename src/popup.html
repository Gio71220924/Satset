<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Satset</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 360px; padding: 14px; }
    .head { margin-bottom: var(--gap); }

    #body { display: grid; gap: var(--gap); }

    .flist {
      display: grid;
      gap: 6px;
      max-height: 260px;
      overflow-y: auto;
    }

    /* Tanda, label, nilai. Nilai dipotong supaya popup tidak melebar. */
    .frow {
      display: grid;
      grid-template-columns: 16px 116px minmax(0, 1fr);
      gap: 8px;
      align-items: baseline;
      font-size: 12px;
    }

    .mark { text-align: center; }
    .mark.mapping   { color: var(--accent); }
    .mark.heuristic { color: var(--warn); }
    .mark.skip      { color: var(--muted); }

    .flabel { color: var(--muted); }

    .fvalue {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wide { width: 100%; }

    /* Aksi sekunder: tetap terlihat bisa diklik, tapi tidak bersaing
       dengan satu tombol utama di layar ini. */
    .linky {
      justify-self: start;
      padding: 4px 0;
      border: 0;
      background: none;
      color: var(--muted);
      text-decoration: underline;
    }

    .linky:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="head row spread">
    <h1>Satset</h1>
    <span class="small muted" id="version"></span>
  </div>

  <div class="stack" id="body">
    <p class="small muted">Memuat…</p>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
